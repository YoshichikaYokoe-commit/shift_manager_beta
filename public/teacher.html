<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>講師シフト</title>

  <meta name="theme-color" content="#2563eb">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #1f2937;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 12px 50px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .app-title {
      margin: 6px 0 18px;
      font-size: 27px;
      font-weight: 800;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.07);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input,
    button,
    select {
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
    }

    input,
    select {
      padding: 13px;
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      padding: 13px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    #loginButton {
      margin-top: 20px;
      background: #2563eb;
      color: white;
    }

    #logoutButton {
      width: auto;
      background: #e5e7eb;
      color: #374151;
      padding: 9px 13px;
      font-size: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .teacher-name {
      margin-bottom: 4px;
      font-size: 24px;
      font-weight: 800;
    }

    .teacher-email {
      margin: 0;
      color: #64748b;
      font-size: 13px;
      word-break: break-all;
    }

    .section-title {
      margin-bottom: 14px;
      font-size: 19px;
    }

    .shift-item {
      border: 1px solid #e2e8f0;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .shift-item:last-child {
      margin-bottom: 0;
    }

    .shift-date {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .shift-time {
      color: #2563eb;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .shift-student {
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-tentative {
      background: #fef3c7;
      color: #92400e;
    }

    .status-confirmed {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .status-cancelled {
      background: #f3f4f6;
      color: #6b7280;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-item {
      padding: 14px 8px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: center;
    }

    .summary-value {
      display: block;
      margin-bottom: 5px;
      font-size: 20px;
      font-weight: 800;
    }

    .summary-label {
      font-size: 12px;
      color: #64748b;
    }

    .month-control {
      margin-bottom: 15px;
    }

    .month-control label {
      margin-top: 0;
    }

    .empty-message {
      margin: 0;
      padding: 20px 5px;
      text-align: center;
      color: #64748b;
    }

    .message {
      min-height: 24px;
      margin: 12px 0;
      text-align: center;
      font-weight: 700;
      color: #b91c1c;
    }

    .availability-form {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 10px;
      align-items: end;
    }

    .availability-form label {
      margin-top: 0;
    }

    #addAvailabilityButton {
      margin-top: 12px;
      background: #2563eb;
      color: white;
    }

    .availability-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }

    .availability-main {
      min-width: 0;
    }

    .availability-date {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .availability-time {
      color: #2563eb;
      font-weight: 800;
    }

    .availability-delete {
      width: auto;
      flex: 0 0 auto;
      padding: 9px 12px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 14px;
    }

    .availability-note {
      margin: 12px 0 0;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 540px) {
      .page {
        padding: 12px 10px 40px;
      }

      .card {
        padding: 17px;
      }

      .app-title {
        font-size: 24px;
      }

      .teacher-name {
        font-size: 21px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        padding: 13px;
      }

      .summary-value {
        margin: 0;
        order: 2;
      }

      .summary-label {
        order: 1;
        font-size: 14px;
      }

      .availability-form {
        grid-template-columns: 1fr;
      }

      .availability-item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1 class="app-title">
      講師シフト
    </h1>


    <!-- ============================= -->
    <!-- ログイン画面 -->
    <!-- ============================= -->

    <section id="loginArea" class="card">

      <h2>
        講師ログイン
      </h2>

      <label for="email">
        メールアドレス
      </label>

      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="teacher@example.com"
      >


      <label for="password">
        パスワード
      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="パスワード"
      >


      <button id="loginButton">
        ログイン
      </button>

    </section>


    <!-- ============================= -->
    <!-- 講師画面 -->
    <!-- ============================= -->

    <main id="app" style="display:none;">


      <!-- 講師情報 -->

      <section class="card">

        <div class="topbar">

          <div>

            <div
              id="teacherName"
              class="teacher-name"
            >
              講師
            </div>

            <p
              id="teacherEmail"
              class="teacher-email"
            ></p>

          </div>


          <button id="logoutButton">
            ログアウト
          </button>

        </div>


      </section>


      <!-- 空き時間登録 -->

      <section class="card">

        <h2 class="section-title">
          空き時間登録
        </h2>

        <div class="availability-form">

          <div>
            <label for="availabilityDate">日付</label>
            <input type="date" id="availabilityDate">
          </div>

          <div>
            <label for="availabilityStartTime">開始</label>
            <input type="time" id="availabilityStartTime">
          </div>

          <div>
            <label for="availabilityEndTime">終了</label>
            <input type="time" id="availabilityEndTime">
          </div>

        </div>

        <button id="addAvailabilityButton" type="button">
          空き時間として登録
        </button>

        <p class="availability-note">
          登録した時間帯は、将来の塾側予約画面から選べるようにします。
          すでに登録済みの空き時間と重なる時間帯は登録できません。
        </p>

        <h3 style="margin-top:22px; margin-bottom:12px;">
          登録済みの空き時間
        </h3>

        <div id="availabilityList"></div>

        <p
          id="availabilityEmpty"
          class="empty-message"
          style="display:none;"
        >
          今後の空き時間は登録されていません。
        </p>

      </section>


      <!-- 今後の授業 -->

      <section class="card">

        <h2 class="section-title">
          今後の授業
        </h2>

        <div id="upcomingShiftList">
        </div>

        <p
          id="upcomingEmpty"
          class="empty-message"
          style="display:none;"
        >
          今後の授業はありません。
        </p>

      </section>


      <!-- 月別実績 -->

      <section class="card">

        <h2 class="section-title">
          月別実績
        </h2>


        <div class="month-control">

          <label for="summaryMonth">
            集計する月
          </label>

          <input
            type="month"
            id="summaryMonth"
          >

        </div>


        <div class="summary-grid">

          <div class="summary-item">

            <span
              id="completedCount"
              class="summary-value"
            >
              0
            </span>

            <span class="summary-label">
              実施済み
            </span>

          </div>


          <div class="summary-item">

            <span
              id="completedHours"
              class="summary-value"
            >
              0時間
            </span>

            <span class="summary-label">
              勤務時間
            </span>

          </div>


          <div class="summary-item">

            <span
              id="salaryAmount"
              class="summary-value"
            >
              0円
            </span>

            <span class="summary-label">
              給与見込み
            </span>

          </div>

        </div>

      </section>


      <!-- 月内の授業 -->

      <section class="card">

        <h2
          id="monthlyTitle"
          class="section-title"
        >
          今月の授業
        </h2>

        <div id="monthlyShiftList">
        </div>

        <p
          id="monthlyEmpty"
          class="empty-message"
          style="display:none;"
        >
          この月の授業はありません。
        </p>

      </section>

    </main>


    <p
      id="message"
      class="message"
    ></p>

  </div>



  <!-- ============================= -->
  <!-- Firebase -->
  <!-- ============================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      addDoc,
      deleteDoc,
      serverTimestamp,
      query,
      where,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



    // ===================================
    // Firebase設定
    // 管理者アプリと同じFirebaseを使用
    // ===================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyBKhOG_ds0dWdcJkJlg6WljpgixLXmloeM",

      authDomain:
        "shift-manager-303a5.firebaseapp.com",

      projectId:
        "shift-manager-303a5",

      storageBucket:
        "shift-manager-303a5.firebasestorage.app",

      messagingSenderId:
        "759595895300",

      appId:
        "1:759595895300:web:962ac3ee0bc16d0f158351"

    };


    const firebaseApp =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(firebaseApp);

    const db =
      getFirestore(firebaseApp);



    // ===================================
    // HTML要素
    // ===================================

    const loginArea =
      document.getElementById("loginArea");

    const appArea =
      document.getElementById("app");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const teacherName =
      document.getElementById("teacherName");

    const teacherEmail =
      document.getElementById("teacherEmail");

    const availabilityDate =
      document.getElementById("availabilityDate");

    const availabilityStartTime =
      document.getElementById("availabilityStartTime");

    const availabilityEndTime =
      document.getElementById("availabilityEndTime");

    const addAvailabilityButton =
      document.getElementById("addAvailabilityButton");

    const availabilityList =
      document.getElementById("availabilityList");

    const availabilityEmpty =
      document.getElementById("availabilityEmpty");

    const upcomingShiftList =
      document.getElementById("upcomingShiftList");

    const upcomingEmpty =
      document.getElementById("upcomingEmpty");

    const summaryMonth =
      document.getElementById("summaryMonth");

    const completedCount =
      document.getElementById("completedCount");

    const completedHours =
      document.getElementById("completedHours");

    const salaryAmount =
      document.getElementById("salaryAmount");

    const monthlyShiftList =
      document.getElementById("monthlyShiftList");

    const monthlyEmpty =
      document.getElementById("monthlyEmpty");

    const monthlyTitle =
      document.getElementById("monthlyTitle");

    const message =
      document.getElementById("message");



    // ===================================
    // 状態
    // ===================================

    let currentUser = null;

    let currentTeacher = null;

    let currentShifts = [];

    let currentAvailabilities = [];

    let unsubscribeShifts = null;

    let unsubscribeAvailability = null;



    // ===================================
    // 初期月
    // ===================================

    const today =
      new Date();

    summaryMonth.value =
      `${today.getFullYear()}-${String(
        today.getMonth() + 1
      ).padStart(2, "0")}`;

    const todayStringForAvailability =
      getLocalDateString(today);

    availabilityDate.min =
      todayStringForAvailability;

    availabilityDate.value =
      todayStringForAvailability;



    // ===================================
    // ログイン
    // ===================================

    loginButton.addEventListener(
      "click",
      async () => {

        message.textContent = "";

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          message.textContent =
            "メールアドレスとパスワードを入力してください。";

          return;
        }


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {

          console.error(error);

          message.textContent =
            "ログインできませんでした。";

        }

      }
    );



    // Enterでもログイン

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          loginButton.click();

        }

      }
    );



    // ===================================
    // ログアウト
    // ===================================

    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );



    // ===================================
    // 認証状態
    // ===================================

    onAuthStateChanged(
      auth,
      async (user) => {

        currentUser = user;

        cleanupShiftListener();
        cleanupAvailabilityListener();


        if (!user) {

          currentTeacher = null;

          currentShifts = [];

          currentAvailabilities = [];

          loginArea.style.display =
            "block";

          appArea.style.display =
            "none";

          teacherName.textContent =
            "講師";

          teacherEmail.textContent =
            "";

          message.textContent =
            "";

          renderAll();

          return;
        }


        loginArea.style.display =
          "none";

        appArea.style.display =
          "none";

        message.textContent =
          "講師情報を確認しています…";


        try {

          const teacher =
            await loadLoggedInTeacher(
              user
            );


          currentTeacher =
            teacher;


          teacherName.textContent =
            `${teacher.name || "講師"} さん`;


          teacherEmail.textContent =
            user.email || teacher.email || "";


          appArea.style.display =
            "block";


          message.textContent =
            "";


          loadTeacherShifts(
            teacher.id
          );

          loadTeacherAvailability(
            teacher.id
          );


        } catch (error) {

          console.error(error);

          currentTeacher = null;

          currentShifts = [];

          currentAvailabilities = [];

          appArea.style.display =
            "none";

          message.textContent =
            error.message ||
            "講師情報の読み込みに失敗しました。";

        }

      }
    );



    // ===================================
    // users/{UID} から権限とteacherIdを取得
    // そのteacherIdでteachersを読む
    // ===================================

    async function loadLoggedInTeacher(
      user
    ) {

      if (!user?.uid) {

        throw new Error(
          "ログインユーザーを確認できませんでした。"
        );

      }


      // 1. users/{Authentication UID} を読む
      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnapshot =
        await getDoc(
          userRef
        );


      if (!userSnapshot.exists()) {

        throw new Error(
          "このアカウントのユーザー設定がありません。管理者に確認してください。"
        );

      }


      const userData =
        userSnapshot.data();


      // 2. 利用停止ユーザーを拒否
      if (
        userData.active === false
      ) {

        throw new Error(
          "このアカウントは現在利用できません。"
        );

      }


      // 3. teacher権限を確認
      const roles =
        Array.isArray(
          userData.roles
        )
          ? userData.roles
          : [];


      if (
        !roles.includes(
          "teacher"
        )
      ) {

        throw new Error(
          "このアカウントには講師権限がありません。"
        );

      }


      // 4. usersに紐づけたteacherIdを取得
      const teacherId =
        String(
          userData.teacherId ||
          ""
        ).trim();


      if (!teacherId) {

        throw new Error(
          "講師IDが設定されていません。管理者に確認してください。"
        );

      }


      // 5. teachers/{teacherId} を読む
      const teacherRef =
        doc(
          db,
          "teachers",
          teacherId
        );


      const teacherSnapshot =
        await getDoc(
          teacherRef
        );


      if (
        !teacherSnapshot.exists()
      ) {

        throw new Error(
          "対応する講師マスタが見つかりません。管理者に確認してください。"
        );

      }


      const teacherData =
        teacherSnapshot.data();


      if (
        teacherData.active === false
      ) {

        throw new Error(
          "講師アカウントが無効になっています。"
        );

      }


      // 給与計算でhourlyRateを使うため、
      // teachersの情報をcurrentTeacherとして返す
      return {

        id:
          teacherSnapshot.id,

        ...teacherData,

        // users側の情報も保持しておく
        userName:
          userData.name || "",

        userEmail:
          userData.email ||
          user.email ||
          "",

        roles

      };

    }



    // ===================================
    // 自分のシフトだけリアルタイム取得
    // ===================================

    function loadTeacherShifts(
      teacherId
    ) {

      cleanupShiftListener();


      const shiftQuery =
        query(
          collection(
            db,
            "shifts"
          ),
          where(
            "teacherId",
            "==",
            teacherId
          )
        );


      unsubscribeShifts =
        onSnapshot(

          shiftQuery,

          (snapshot) => {

            const shifts = [];


            snapshot.forEach(
              (document) => {

                shifts.push({

                  id:
                    document.id,

                  ...document.data()

                });

              }
            );


            shifts.sort(
              compareShiftDateTime
            );


            currentShifts =
              shifts;


            renderAll();

          },

          (error) => {

            console.error(error);

            message.textContent =
              "シフトの読み込みに失敗しました。";

          }

        );

    }



    function cleanupShiftListener() {

      if (
        unsubscribeShifts
      ) {

        unsubscribeShifts();

        unsubscribeShifts =
          null;

      }

    }



    // ===================================
    // 空き時間登録
    // ===================================

    addAvailabilityButton.addEventListener(
      "click",
      async () => {

        if (!currentUser || !currentTeacher) {

          message.textContent =
            "講師としてログインしてください。";

          return;

        }


        const date =
          availabilityDate.value;

        const startTime =
          availabilityStartTime.value;

        const endTime =
          availabilityEndTime.value;


        if (!date || !startTime || !endTime) {

          message.textContent =
            "日付・開始時間・終了時間を入力してください。";

          return;

        }


        if (date < getLocalDateString(new Date())) {

          message.textContent =
            "過去の日付は登録できません。";

          return;

        }


        if (endTime <= startTime) {

          message.textContent =
            "終了時間は開始時間より後にしてください。";

          return;

        }


        const overlaps =
          currentAvailabilities.some(
            (item) => {

              if (item.date !== date) {
                return false;
              }

              return (
                startTime < item.endTime &&
                endTime > item.startTime
              );

            }
          );


        if (overlaps) {

          message.textContent =
            "その時間帯は、すでに登録済みの空き時間と重なっています。";

          return;

        }


        try {

          await addDoc(
            collection(
              db,
              "availability"
            ),
            {
              teacherId:
                currentTeacher.id,

              teacherName:
                currentTeacher.name || "",

              date,
              startTime,
              endTime,
              active: true,
              status: "open",

              createdByUid:
                currentUser.uid,

              createdByEmail:
                currentUser.email || "",

              createdAt:
                serverTimestamp()
            }
          );


          availabilityStartTime.value =
            "";

          availabilityEndTime.value =
            "";

          message.textContent =
            "空き時間を登録しました。";

          clearMessageLater();

        } catch (error) {

          console.error(error);

          message.textContent =
            "空き時間を登録できませんでした。";

        }

      }
    );



    function loadTeacherAvailability(
      teacherId
    ) {

      cleanupAvailabilityListener();


      const availabilityQuery =
        query(
          collection(
            db,
            "availability"
          ),
          where(
            "teacherId",
            "==",
            teacherId
          )
        );


      unsubscribeAvailability =
        onSnapshot(
          availabilityQuery,
          (snapshot) => {

            const items = [];

            snapshot.forEach(
              (document) => {

                const data =
                  document.data();

                if (data.active === false) {
                  return;
                }

                items.push({
                  id: document.id,
                  ...data
                });

              }
            );


            items.sort(
              compareShiftDateTime
            );

            currentAvailabilities =
              items;

            renderAvailability();

          },
          (error) => {

            console.error(error);

            message.textContent =
              "空き時間の読み込みに失敗しました。";

          }
        );

    }



    function cleanupAvailabilityListener() {

      if (unsubscribeAvailability) {

        unsubscribeAvailability();
        unsubscribeAvailability = null;

      }

    }



    function renderAvailability() {

      availabilityList.innerHTML =
        "";

      const todayString =
        getLocalDateString(
          new Date()
        );

      const upcomingItems =
        currentAvailabilities.filter(
          (item) =>
            item.date >= todayString &&
            (item.status || "open") === "open"
        );


      if (upcomingItems.length === 0) {

        availabilityEmpty.style.display =
          "block";

        return;

      }


      availabilityEmpty.style.display =
        "none";


      upcomingItems.forEach(
        (item) => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "availability-item";

          row.innerHTML = `
            <div class="availability-main">
              <div class="availability-date">
                ${escapeHtml(formatDate(item.date))}
              </div>
              <div class="availability-time">
                ${escapeHtml(item.startTime || "--:--")}
                ～
                ${escapeHtml(item.endTime || "--:--")}
              </div>
            </div>
            <button
              class="availability-delete"
              type="button"
              data-id="${escapeHtml(item.id)}"
            >
              削除
            </button>
          `;

          availabilityList.appendChild(
            row
          );

        }
      );


      document
        .querySelectorAll(
          ".availability-delete"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              async () => {

                const availabilityId =
                  button.dataset.id;

                const item =
                  currentAvailabilities.find(
                    (value) =>
                      value.id === availabilityId
                  );

                if (!item) {
                  return;
                }

                const ok = confirm(
                  `${formatDate(item.date)} ${item.startTime}～${item.endTime} の空き時間を削除しますか？`
                );

                if (!ok) {
                  return;
                }

                try {

                  await deleteDoc(
                    doc(
                      db,
                      "availability",
                      availabilityId
                    )
                  );

                  message.textContent =
                    "空き時間を削除しました。";

                  clearMessageLater();

                } catch (error) {

                  console.error(error);

                  message.textContent =
                    "空き時間を削除できませんでした。";

                }

              }
            );

          }
        );

    }



    // ===================================
    // 月変更
    // ===================================

    summaryMonth.addEventListener(
      "change",
      () => {

        renderMonthlySummary();

        renderMonthlyShifts();

      }
    );



    // ===================================
    // 全画面更新
    // ===================================

    function renderAll() {

      renderAvailability();

      renderUpcomingShifts();

      renderMonthlySummary();

      renderMonthlyShifts();

    }



    // ===================================
    // 今後のシフト
    // ===================================

    function renderUpcomingShifts() {

      upcomingShiftList.innerHTML =
        "";


      const todayString =
        getLocalDateString(
          new Date()
        );


      const upcoming =
        currentShifts.filter(
          (shift) => {

            const status =
              normalizeStatus(
                shift.status
              );


            return (

              shift.date >=
                todayString &&

              status !==
                "cancelled"

            );

          }
        );


      if (
        upcoming.length === 0
      ) {

        upcomingEmpty.style.display =
          "block";

        return;

      }


      upcomingEmpty.style.display =
        "none";


      upcoming
        .slice(0, 10)
        .forEach(
          (shift) => {

            upcomingShiftList.appendChild(
              createShiftCard(
                shift
              )
            );

          }
        );

    }



    // ===================================
    // 月別実績
    // ===================================

    function renderMonthlySummary() {

      const targetMonth =
        summaryMonth.value;


      if (!targetMonth) {

        completedCount.textContent =
          "0";

        completedHours.textContent =
          "0時間";

        salaryAmount.textContent =
          "0円";

        return;

      }


      const completed =
        currentShifts.filter(
          (shift) => {

            return (

              shift.date?.startsWith(
                targetMonth
              ) &&

              normalizeStatus(
                shift.status
              ) ===
                "completed"

            );

          }
        );


      let totalMinutes =
        0;


      completed.forEach(
        (shift) => {

          totalMinutes +=
            calculateDurationMinutes(
              shift.startTime,
              shift.endTime
            );

        }
      );


      const hours =
        totalMinutes / 60;


      const hourlyRate =
        Number(
          currentTeacher
            ?.hourlyRate
        ) || 0;


      const salary =
        Math.round(
          hours *
          hourlyRate
        );


      completedCount.textContent =
        `${completed.length}コマ`;


      completedHours.textContent =
        formatHours(
          totalMinutes
        );


      salaryAmount.textContent =
        `${salary.toLocaleString(
          "ja-JP"
        )}円`;

    }



    // ===================================
    // 月内シフト一覧
    // ===================================

    function renderMonthlyShifts() {

      monthlyShiftList.innerHTML =
        "";


      const targetMonth =
        summaryMonth.value;


      if (!targetMonth) {

        monthlyEmpty.style.display =
          "block";

        return;

      }


      const [
        year,
        month
      ] =
        targetMonth
          .split("-")
          .map(Number);


      monthlyTitle.textContent =
        `${year}年${month}月の授業`;


      const monthly =
        currentShifts.filter(
          (shift) => {

            return (
              shift.date?.startsWith(
                targetMonth
              )
            );

          }
        );


      if (
        monthly.length === 0
      ) {

        monthlyEmpty.style.display =
          "block";

        return;

      }


      monthlyEmpty.style.display =
        "none";


      monthly.forEach(
        (shift) => {

          monthlyShiftList.appendChild(
            createShiftCard(
              shift
            )
          );

        }
      );

    }



    // ===================================
    // シフトカード
    // ===================================

    function createShiftCard(
      shift
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "shift-item";


      const status =
        normalizeStatus(
          shift.status
        );


      card.innerHTML = `

        <div class="shift-date">

          ${escapeHtml(
            formatDate(
              shift.date
            )
          )}

        </div>


        <div class="shift-time">

          ${escapeHtml(
            shift.startTime ||
            "--:--"
          )}

          ～

          ${escapeHtml(
            shift.endTime ||
            "--:--"
          )}

        </div>


        <div class="shift-student">

          生徒：

          <strong>

            ${escapeHtml(
              shift.studentName ||
              "未設定"
            )}

          </strong>

        </div>


        <span
          class="status ${getStatusClass(
            status
          )}"
        >

          ${escapeHtml(
            getStatusLabel(
              status
            )
          )}

        </span>

      `;


      return card;

    }



    // ===================================
    // 日時ソート
    // ===================================

    function compareShiftDateTime(
      a,
      b
    ) {

      const aValue =
        `${a.date || ""} ${a.startTime || ""}`;

      const bValue =
        `${b.date || ""} ${b.startTime || ""}`;


      return aValue.localeCompare(
        bValue
      );

    }



    // ===================================
    // 時間計算
    // ===================================

    function calculateDurationMinutes(
      startTime,
      endTime
    ) {

      if (
        !startTime ||
        !endTime
      ) {

        return 0;

      }


      const [
        startHour,
        startMinute
      ] =
        startTime
          .split(":")
          .map(Number);


      const [
        endHour,
        endMinute
      ] =
        endTime
          .split(":")
          .map(Number);


      const start =
        startHour * 60 +
        startMinute;


      const end =
        endHour * 60 +
        endMinute;


      return Math.max(
        0,
        end - start
      );

    }



    function formatHours(
      minutes
    ) {

      const hours =
        Math.floor(
          minutes / 60
        );


      const remainingMinutes =
        minutes % 60;


      if (
        remainingMinutes === 0
      ) {

        return `${hours}時間`;

      }


      return (
        `${hours}時間` +
        `${remainingMinutes}分`
      );

    }



    // ===================================
    // ステータス
    // ===================================

    function normalizeStatus(
      status
    ) {

      const allowed = [
        "tentative",
        "confirmed",
        "completed",
        "cancelled"
      ];


      return allowed.includes(
        status
      )
        ? status
        : "tentative";

    }



    function getStatusLabel(
      status
    ) {

      const labels = {

        tentative:
          "予定（未定）",

        confirmed:
          "予定（確定）",

        completed:
          "実施済み",

        cancelled:
          "キャンセル"

      };


      return (
        labels[status] ||
        "予定（未定）"
      );

    }



    function getStatusClass(
      status
    ) {

      return (
        `status-${status}`
      );

    }



    // ===================================
    // 日付表示
    // ===================================

    function formatDate(
      dateString
    ) {

      if (!dateString) {
        return "日付未設定";
      }


      const date =
        new Date(
          `${dateString}T00:00:00`
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return dateString;

      }


      const weekdays = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
      ];


      return (
        `${date.getMonth() + 1}月` +
        `${date.getDate()}日` +
        `（${weekdays[
          date.getDay()
        ]}）`
      );

    }



    function getLocalDateString(
      date
    ) {

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        );

      const day =
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        `${year}-${month}-${day}`
      );

    }



    function clearMessageLater() {

      setTimeout(
        () => {
          message.textContent = "";
        },
        2500
      );

    }



    // ===================================
    // HTMLエスケープ
    // ===================================

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>
