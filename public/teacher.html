<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講師シフト</title>
  <meta name="theme-color" content="#2563eb">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --warning: #92400e;
      --warning-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --success: #166534;
      --success-soft: #dcfce7;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 12px 54px;
    }

    h1, h2, h3, p { margin-top: 0; }

    .app-title {
      margin: 4px 0 18px;
      font-size: 27px;
      font-weight: 850;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.07);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .teacher-name {
      font-size: 23px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .teacher-email {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }

    .summary-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .summary-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }

    .summary-chip.pending {
      background: var(--warning-soft);
      color: var(--warning);
    }

    label {
      display: block;
      margin: 13px 0 6px;
      font-weight: 750;
    }

    input, select, button {
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
    }

    input, select {
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }

    button {
      padding: 11px 14px;
      border: none;
      cursor: pointer;
      font-weight: 800;
    }

    #loginButton {
      margin-top: 18px;
      background: var(--primary);
      color: #fff;
    }

    #logoutButton {
      width: auto;
      padding: 9px 13px;
      background: #e5e7eb;
      color: #374151;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .tabButton {
      width: auto;
      flex: 0 0 auto;
      padding: 10px 15px;
      background: #e5e7eb;
      color: #374151;
    }

    .tabButton.active {
      background: var(--primary);
      color: #fff;
    }

    .tabPanel { display: none; }
    .tabPanel.active { display: block; }

    .section-title {
      margin-bottom: 6px;
      font-size: 20px;
    }

    .section-subtitle {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Calendar */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .calendar-header h2 {
      margin: 0;
      flex: 1;
      text-align: center;
      font-size: 20px;
    }

    .calendar-nav {
      width: auto;
      min-width: 52px;
      padding: 9px 12px;
      background: #eef2f7;
      color: #334155;
    }

    .calendar-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(118px, 1fr));
      min-width: 826px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .calendar-weekday,
    .calendar-day {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .calendar-weekday {
      padding: 9px 6px;
      text-align: center;
      font-weight: 850;
      background: #f8fafc;
    }

    .calendar-weekday.sunday { color: #c62828; }
    .calendar-weekday.saturday { color: #1565c0; }

    .calendar-day {
      min-height: 135px;
      padding: 7px;
      background: #fff;
    }

    .calendar-day.other-month {
      background: #f8fafc;
      color: #94a3b8;
    }

    .calendar-day.today {
      background: #fffdf1;
    }

    .calendar-date-number {
      margin-bottom: 6px;
      font-weight: 850;
    }

    .calendar-event {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 6px;
      border-radius: 7px;
      text-align: left;
      font-size: 11px;
      line-height: 1.35;
      color: #1f2937;
      background: #eaf2ff;
    }

    .calendar-event.pending {
      background: var(--warning-soft);
      color: #78350f;
    }

    .calendar-event.completed {
      background: var(--success-soft);
      color: #166534;
      opacity: 0.75;
    }

    .calendar-event.cancelled {
      background: #f1f5f9;
      color: #64748b;
      opacity: 0.55;
    }

    .calendar-event.overdue {
      background: #fee2e2;
      color: #991b1b;
    }

    .calendar-event-time {
      font-weight: 850;
    }

    .calendar-detail {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8fafc;
      line-height: 1.65;
    }

    .calendar-detail.show {
      display: block;
    }

    .detail-note {
      margin-top: 10px;
      padding: 10px;
      border-radius: 9px;
      background: #fff;
      white-space: pre-wrap;
    }

    /* Approval */
    .approval-item {
      border: 1px solid #f4d58d;
      border-left: 4px solid #f59e0b;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fffdf5;
    }

    .approval-title {
      font-size: 17px;
      font-weight: 850;
      margin-bottom: 6px;
    }

    .approval-time {
      color: var(--primary);
      font-size: 17px;
      font-weight: 850;
      margin-bottom: 7px;
    }

    .approval-meta {
      margin: 5px 0;
      line-height: 1.55;
    }

    .approval-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .approveButton {
      background: var(--success-soft);
      color: var(--success);
    }

    .rejectButton {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Availability */
    .availability-form {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 10px;
      align-items: end;
    }

    .availability-form label {
      margin-top: 0;
    }

    #addAvailabilityButton {
      margin-top: 12px;
      background: var(--primary);
      color: white;
    }

    .availability-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }

    .availability-date {
      font-weight: 850;
      margin-bottom: 4px;
    }

    .availability-time {
      color: var(--primary);
      font-weight: 850;
    }

    .availability-delete {
      width: auto;
      flex: 0 0 auto;
      padding: 9px 12px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 14px;
    }

    .availability-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Result */
    .month-control {
      margin-bottom: 15px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-item {
      padding: 14px 8px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: center;
    }

    .summary-value {
      display: block;
      margin-bottom: 5px;
      font-size: 20px;
      font-weight: 850;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .shift-item {
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fff;
    }

    .shift-date {
      margin-bottom: 6px;
      font-size: 16px;
      font-weight: 850;
    }

    .shift-time {
      margin-bottom: 7px;
      color: var(--primary);
      font-size: 18px;
      font-weight: 850;
    }

    .shift-meta {
      margin: 5px 0;
      line-height: 1.55;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
    }

    .status-tentative {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-confirmed {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-completed {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-cancelled {
      background: #f3f4f6;
      color: #6b7280;
    }

    .empty-message {
      margin: 0;
      padding: 22px 5px;
      text-align: center;
      color: var(--muted);
    }

    .message {
      min-height: 24px;
      margin: 12px 0;
      text-align: center;
      font-weight: 800;
      color: var(--danger);
    }

    @media (max-width: 640px) {
      .page { padding: 12px 10px 40px; }
      .card { padding: 17px; }
      .app-title { font-size: 24px; }
      .teacher-name { font-size: 21px; }

      .availability-form,
      .approval-actions,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .availability-item {
        align-items: flex-start;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
      }

      .summary-value {
        margin: 0;
        order: 2;
      }
    }
  </style>

  <link rel="manifest" href="/manifest-teacher.json">
  <link rel="apple-touch-icon" href="/teacher-icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="講師シフト">

</head>

<body>
  <div class="page">
    <h1 class="app-title">講師シフト</h1>

    <section id="loginArea" class="card">
      <h2>講師ログイン</h2>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" autocomplete="email" placeholder="teacher@example.com">

      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="パスワード">

      <button id="loginButton">ログイン</button>
    </section>

    <main id="app" style="display:none;">
      <section class="card">
        <div class="topbar">
          <div>
            <div id="teacherName" class="teacher-name">講師</div>
            <p id="teacherEmail" class="teacher-email"></p>

            <div class="summary-row">
              <span id="pendingCountChip" class="summary-chip pending">承認待ち 0件</span>
              <span id="upcomingCountChip" class="summary-chip">今後の授業 0件</span>
              <span id="openCountChip" class="summary-chip">空き枠 0件</span>
            </div>
          </div>

          <button id="logoutButton">ログアウト</button>
        </div>
      </section>

      <div class="tabs">
        <button class="tabButton active" data-tab="calendar">カレンダー</button>
        <button id="approvalTabButton" class="tabButton" data-tab="approvals">承認待ち</button>
        <button class="tabButton" data-tab="availability">空き時間</button>
        <button class="tabButton" data-tab="results">実績</button>
      </div>

      <section id="tab-calendar" class="tabPanel active">
        <section class="card">
          <div class="calendar-header">
            <button id="prevMonthButton" class="calendar-nav">←</button>
            <h2 id="calendarTitle"></h2>
            <button id="nextMonthButton" class="calendar-nav">→</button>
          </div>

          <div class="calendar-scroll">
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>

          <div id="calendarDetail" class="calendar-detail"></div>
        </section>
      </section>

      <section id="tab-approvals" class="tabPanel">
        <section class="card">
          <h2 class="section-title">塾からの予約依頼</h2>
          <p class="section-subtitle">
            承認すると「予定（確定）」になります。却下すると、その空き枠は再び予約可能になります。
          </p>

          <div id="approvalList"></div>

          <p id="approvalEmpty" class="empty-message" style="display:none;">
            承認待ちの予約依頼はありません。
          </p>
        </section>
      </section>

      <section id="tab-availability" class="tabPanel">
        <section class="card">
          <h2 class="section-title">空き時間登録</h2>

          <div class="availability-form">
            <div>
              <label for="availabilityDate">日付</label>
              <input type="date" id="availabilityDate">
            </div>

            <div>
              <label for="availabilityStartTime">開始</label>
              <input type="time" id="availabilityStartTime">
            </div>

            <div>
              <label for="availabilityEndTime">終了</label>
              <input type="time" id="availabilityEndTime">
            </div>
          </div>

          <button id="addAvailabilityButton" type="button">
            空き時間として登録
          </button>

          <p class="availability-note">
            現在は日付単位で登録します。承認待ち・予約済みの枠は削除対象には出しません。
          </p>

          <h3 style="margin-top:22px; margin-bottom:12px;">
            登録済みの空き時間
          </h3>

          <div id="availabilityList"></div>

          <p id="availabilityEmpty" class="empty-message" style="display:none;">
            今後の空き時間は登録されていません。
          </p>
        </section>
      </section>

      <section id="tab-results" class="tabPanel">
        <section class="card">
          <h2 class="section-title">月別実績</h2>

          <div class="month-control">
            <label for="summaryMonth">集計する月</label>
            <input type="month" id="summaryMonth">
          </div>

          <div class="summary-grid">
            <div class="summary-item">
              <span id="completedCount" class="summary-value">0</span>
              <span class="summary-label">実施済み</span>
            </div>

            <div class="summary-item">
              <span id="completedHours" class="summary-value">0時間</span>
              <span class="summary-label">勤務時間</span>
            </div>

            <div class="summary-item">
              <span id="salaryAmount" class="summary-value">0円</span>
              <span class="summary-label">給与見込み</span>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 id="monthlyTitle" class="section-title">今月の授業</h2>
          <div id="monthlyShiftList"></div>

          <p id="monthlyEmpty" class="empty-message" style="display:none;">
            この月の授業はありません。
          </p>
        </section>
      </section>
    </main>

    <p id="message" class="message"></p>
  </div>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      addDoc,
      deleteDoc,
      query,
      where,
      onSnapshot,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBKhOG_ds0dWdcJkJlg6WljpgixLXmloeM",
      authDomain: "shift-manager-303a5.firebaseapp.com",
      projectId: "shift-manager-303a5",
      storageBucket: "shift-manager-303a5.firebasestorage.app",
      messagingSenderId: "759595895300",
      appId: "1:759595895300:web:962ac3ee0bc16d0f158351"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    const loginArea = document.getElementById("loginArea");
    const appArea = document.getElementById("app");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");

    const teacherName = document.getElementById("teacherName");
    const teacherEmail = document.getElementById("teacherEmail");
    const pendingCountChip = document.getElementById("pendingCountChip");
    const approvalTabButton = document.getElementById("approvalTabButton");
    const upcomingCountChip = document.getElementById("upcomingCountChip");
    const openCountChip = document.getElementById("openCountChip");

    const calendarTitle = document.getElementById("calendarTitle");
    const calendarGrid = document.getElementById("calendarGrid");
    const calendarDetail = document.getElementById("calendarDetail");
    const prevMonthButton = document.getElementById("prevMonthButton");
    const nextMonthButton = document.getElementById("nextMonthButton");

    const approvalList = document.getElementById("approvalList");
    const approvalEmpty = document.getElementById("approvalEmpty");

    const availabilityDate = document.getElementById("availabilityDate");
    const availabilityStartTime = document.getElementById("availabilityStartTime");
    const availabilityEndTime = document.getElementById("availabilityEndTime");
    const addAvailabilityButton = document.getElementById("addAvailabilityButton");
    const availabilityList = document.getElementById("availabilityList");
    const availabilityEmpty = document.getElementById("availabilityEmpty");

    const summaryMonth = document.getElementById("summaryMonth");
    const completedCount = document.getElementById("completedCount");
    const completedHours = document.getElementById("completedHours");
    const salaryAmount = document.getElementById("salaryAmount");
    const monthlyShiftList = document.getElementById("monthlyShiftList");
    const monthlyEmpty = document.getElementById("monthlyEmpty");
    const monthlyTitle = document.getElementById("monthlyTitle");

    const message = document.getElementById("message");

    let currentUser = null;
    let currentTeacher = null;
    let currentShifts = [];
    let currentAvailabilities = [];
    let unsubscribeShifts = null;
    let unsubscribeAvailability = null;

    const now = new Date();
    let calendarYear = now.getFullYear();
    let calendarMonth = now.getMonth();

    summaryMonth.value =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

    availabilityDate.min = getLocalDateString(now);
    availabilityDate.value = getLocalDateString(now);

    document.querySelectorAll(".tabButton").forEach((button) => {
      button.addEventListener("click", () => activateTab(button.dataset.tab));
    });

    pendingCountChip.style.cursor = "pointer";
    pendingCountChip.addEventListener("click", () => {
      activateTab("approvals");
    });

    function activateTab(tabName) {
      document.querySelectorAll(".tabButton").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === tabName);
      });

      document.querySelectorAll(".tabPanel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `tab-${tabName}`);
      });

      renderHeaderSummary();
    }

    loginButton.addEventListener("click", async () => {
      message.textContent = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        message.textContent = "メールアドレスとパスワードを入力してください。";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        message.textContent = "ログインできませんでした。";
      }
    });

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") loginButton.click();
    });

    logoutButton.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      cleanupShiftListener();
      cleanupAvailabilityListener();

      if (!user) {
        currentTeacher = null;
        currentShifts = [];
        currentAvailabilities = [];

        loginArea.style.display = "block";
        appArea.style.display = "none";
        teacherName.textContent = "講師";
        teacherEmail.textContent = "";
        renderAll();
        return;
      }

      loginArea.style.display = "none";
      appArea.style.display = "none";
      message.textContent = "講師情報を確認しています…";

      try {
        currentTeacher = await loadLoggedInTeacher(user);

        teacherName.textContent = `${currentTeacher.name || "講師"} さん`;
        teacherEmail.textContent = user.email || currentTeacher.email || "";

        appArea.style.display = "block";
        message.textContent = "";

        loadTeacherShifts(currentTeacher.id);
        loadTeacherAvailability(currentTeacher.id);

      } catch (error) {
        console.error(error);
        currentTeacher = null;
        currentShifts = [];
        currentAvailabilities = [];
        appArea.style.display = "none";

        message.textContent =
          error.message || "講師情報の読み込みに失敗しました。";
      }
    });

    async function loadLoggedInTeacher(user) {
      if (!user?.uid) {
        throw new Error("ログインユーザーを確認できませんでした。");
      }

      const userSnapshot = await getDoc(
        doc(db, "users", user.uid)
      );

      if (!userSnapshot.exists()) {
        throw new Error(
          "このアカウントのユーザー設定がありません。管理者に確認してください。"
        );
      }

      const userData = userSnapshot.data();

      if (userData.active === false) {
        throw new Error("このアカウントは現在利用できません。");
      }

      const roles = Array.isArray(userData.roles)
        ? userData.roles
        : [];

      if (!roles.includes("teacher")) {
        throw new Error("このアカウントには講師権限がありません。");
      }

      const teacherId = String(userData.teacherId || "").trim();

      if (!teacherId) {
        throw new Error("講師IDが設定されていません。管理者に確認してください。");
      }

      const teacherSnapshot = await getDoc(
        doc(db, "teachers", teacherId)
      );

      if (!teacherSnapshot.exists()) {
        throw new Error("対応する講師マスタが見つかりません。管理者に確認してください。");
      }

      const teacherData = teacherSnapshot.data();

      if (teacherData.active === false) {
        throw new Error("講師アカウントが無効になっています。");
      }

      return {
        id: teacherSnapshot.id,
        ...teacherData,
        userName: userData.name || "",
        userEmail: userData.email || user.email || "",
        roles
      };
    }

        where("teacherId", "==", teacherId)

        shiftQuery,
        (snapshot) => {

          snapshot.forEach((document) => {
            shifts.push({
              id: document.id,
              ...document.data()
            });

          shifts.sort(compareShiftDateTime);
          currentShifts = shifts;
          renderAll();

        (error) => {
          console.error(error);
          message.textContent = "シフトの読み込みに失敗しました。";

    function cleanupShiftListener() {
      if (unsubscribeShifts) {
        unsubscribeShifts();
        unsubscribeShifts = null;

    function loadTeacherAvailability(teacherId) {

      const availabilityQuery = query(

    async function approveRequest(shiftId) {
      const shift = currentShifts.find((item) => item.id === shiftId);

      if (!shift || !currentTeacher) return;

      const ok = confirm(
        "この予約依頼を承認しますか？\n\n" +
        `${formatDate(shift.date)} ${shift.startTime || ""}〜${shift.endTime || ""}\n` +
        `生徒：${shift.studentName || ""}\n` +
        `教科：${shift.subjectName || shift.subjectId || "未設定"}`
      );

      if (!ok) return;

      const shiftRef = doc(db, "shifts", shiftId);

      try {
        await runTransaction(db, async (transaction) => {
          const shiftSnapshot = await transaction.get(shiftRef);

          if (!shiftSnapshot.exists()) {
            throw new Error("SHIFT_NOT_FOUND");
          }

          const latestShift = shiftSnapshot.data();

          if (
            latestShift.teacherId !== currentTeacher.id ||
            latestShift.approvalStatus !== "pending" ||
            normalizeStatus(latestShift.status) !== "tentative"
          ) {
            throw new Error("REQUEST_CHANGED");
          }

          let availabilityRef = null;
          let availabilitySnapshot = null;

          if (latestShift.availabilityId) {
            availabilityRef = doc(
              db,
              "availability",
              latestShift.availabilityId
            );

            availabilitySnapshot = await transaction.get(availabilityRef);
          }

          transaction.update(shiftRef, {
            status: "confirmed",
            approvalStatus: "approved",
            approvedByUid: currentUser.uid,
            approvedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          if (
            availabilityRef &&
            availabilitySnapshot &&
            availabilitySnapshot.exists()
          ) {
            const availabilityData = availabilitySnapshot.data();

            if (
              availabilityData.status === "requested" &&
              availabilityData.requestedShiftId === shiftId
            ) {
              transaction.update(availabilityRef, {
                status: "booked",
                bookedShiftId: shiftId,
                bookedBySchoolId: latestShift.schoolId || "",
                bookedAt: serverTimestamp(),
                requestedShiftId: "",
                requestedBySchoolId: "",
                requestedAt: null,
                updatedAt: serverTimestamp()
              });
            }
          }
        });

        message.textContent = "予約依頼を承認しました。";
        clearMessageLater();

      } catch (error) {
        console.error(error);

        message.textContent =
          error.message === "REQUEST_CHANGED"
            ? "この予約依頼はすでに状態が変更されています。"
            : "予約依頼を承認できませんでした。";
      }
    }

    async function rejectRequest(shiftId) {
      const shift = currentShifts.find((item) => item.id === shiftId);

      if (!shift || !currentTeacher) return;

      const reason = prompt(
        "却下理由を入力してください。\n空欄でも却下できます。"
      );

      if (reason === null) return;

      const ok = confirm(
        "この予約依頼を却下しますか？\n\n" +
        `${formatDate(shift.date)} ${shift.startTime || ""}〜${shift.endTime || ""}\n` +
        `生徒：${shift.studentName || ""}`
      );

      if (!ok) return;

      const shiftRef = doc(db, "shifts", shiftId);

      try {
        await runTransaction(db, async (transaction) => {
          const shiftSnapshot = await transaction.get(shiftRef);

          if (!shiftSnapshot.exists()) {
            throw new Error("SHIFT_NOT_FOUND");
          }

          const latestShift = shiftSnapshot.data();

          if (
            latestShift.teacherId !== currentTeacher.id ||
            latestShift.approvalStatus !== "pending" ||
            normalizeStatus(latestShift.status) !== "tentative"
          ) {
            throw new Error("REQUEST_CHANGED");
          }

          let availabilityRef = null;
          let availabilitySnapshot = null;

          if (latestShift.availabilityId) {
            availabilityRef = doc(
              db,
              "availability",
              latestShift.availabilityId
            );

            availabilitySnapshot = await transaction.get(availabilityRef);
          }

          transaction.update(shiftRef, {
            status: "cancelled",
            approvalStatus: "rejected",
            rejectionReason: reason || "",
            rejectedByUid: currentUser.uid,
            rejectedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          if (
            availabilityRef &&
            availabilitySnapshot &&
            availabilitySnapshot.exists()
          ) {
            const availabilityData = availabilitySnapshot.data();

            if (
              availabilityData.status === "requested" &&
              availabilityData.requestedShiftId === shiftId
            ) {
              transaction.update(availabilityRef, {
                status: "open",
                requestedShiftId: "",
                requestedBySchoolId: "",
                requestedAt: null,
                updatedAt: serverTimestamp()
              });
            }
          }
        });

        message.textContent = "予約依頼を却下しました。空き枠に戻しました。";
        clearMessageLater();

      } catch (error) {
        console.error(error);

        message.textContent =
          error.message === "REQUEST_CHANGED"
            ? "この予約依頼はすでに状態が変更されています。"
            : "予約依頼を却下できませんでした。";
      }
    }

    function renderCalendar() {
      calendarGrid.innerHTML = "";
      calendarDetail.classList.remove("show");
      calendarDetail.innerHTML = "";

      calendarTitle.textContent =
        `${calendarYear}年${calendarMonth + 1}月`;

      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

      weekdays.forEach((weekday, index) => {
        const header = document.createElement("div");
        header.className = "calendar-weekday";

        if (index === 0) header.classList.add("sunday");
        if (index === 6) header.classList.add("saturday");

        header.textContent = weekday;
        calendarGrid.appendChild(header);
      });

      const firstDay = new Date(calendarYear, calendarMonth, 1);
      const firstWeekday = firstDay.getDay();
      const daysInMonth =
        new Date(calendarYear, calendarMonth + 1, 0).getDate();
      const daysInPrevMonth =
        new Date(calendarYear, calendarMonth, 0).getDate();

      const todayString = getLocalDateString(new Date());

      for (let cellIndex = 0; cellIndex < 42; cellIndex++) {
        let year = calendarYear;
        let month = calendarMonth;
        let dayNumber;
        let otherMonth = false;

        if (cellIndex < firstWeekday) {
          dayNumber =
            daysInPrevMonth - firstWeekday + cellIndex + 1;
          month--;
          otherMonth = true;

          if (month < 0) {
            month = 11;
            year--;
          }

        } else if (cellIndex >= firstWeekday + daysInMonth) {
          dayNumber =
            cellIndex - (firstWeekday + daysInMonth) + 1;
          month++;
          otherMonth = true;

          if (month > 11) {
            month = 0;
            year++;
          }

        } else {
          dayNumber = cellIndex - firstWeekday + 1;
        }

        const dateString = toDateString(year, month, dayNumber);
        const dayCell = document.createElement("div");

        dayCell.className = "calendar-day";

        if (otherMonth) dayCell.classList.add("other-month");
        if (dateString === todayString) dayCell.classList.add("today");

        const dateNumber = document.createElement("div");
        dateNumber.className = "calendar-date-number";
        dateNumber.textContent = dayNumber;

        dayCell.appendChild(dateNumber);

        const dayShifts = currentShifts
          .filter((shift) => shift.date === dateString)
          .sort(compareShiftDateTime);

        dayShifts.forEach((shift) => {
          const button = document.createElement("button");
          const status = normalizeStatus(shift.status);

          button.className = "calendar-event";

          if (shift.approvalStatus === "pending") {
            button.classList.add("pending");
          } else if (status === "completed") {
            button.classList.add("completed");
          } else if (status === "cancelled") {
            button.classList.add("cancelled");
          } else if (isOverdueUncompleted(shift)) {
            button.classList.add("overdue");
          }

          button.innerHTML = `
            <span class="calendar-event-time">
              ${escapeHtml(shift.startTime || "--:--")}
            </span><br>
            ${escapeHtml(shift.studentName || "未設定")}<br>
            ${escapeHtml(
              shift.approvalStatus === "pending"
                ? "承認待ち"
                : shift.subjectName || getStatusLabel(status)
            )}
          `;

          button.addEventListener("click", () => {
            showCalendarDetail(shift);
          });

          dayCell.appendChild(button);
        });

        calendarGrid.appendChild(dayCell);
      }
    }

    function showCalendarDetail(shift) {
      const status = normalizeStatus(shift.status);

      calendarDetail.innerHTML = `
        <strong>${escapeHtml(formatDate(shift.date))}</strong><br>
        ${escapeHtml(shift.startTime || "--:--")}〜${escapeHtml(shift.endTime || "--:--")}<br>
        生徒：${escapeHtml(shift.studentName || "未設定")}<br>
        塾：${escapeHtml(shift.schoolName || "未設定")}<br>
        教科：${escapeHtml(shift.subjectName || shift.subjectId || "未設定")}<br>
        状態：${escapeHtml(
          shift.approvalStatus === "pending"
            ? "承認待ち"
            : getStatusLabel(status)
        )}
        ${
          shift.lessonNote
            ? `<div class="detail-note">${escapeHtml(shift.lessonNote)}</div>`
            : ""
        }
      `;

      calendarDetail.classList.add("show");

    function isOverdueUncompleted(shift) {
      const status = normalizeStatus(shift.status);

      if (
        status === "completed" ||
        status === "cancelled" ||
        shift.approvalStatus === "pending"
      ) {
        return false;
      }

      if (!shift.date) return false;

      const endTime =
        shift.endTime || shift.startTime || "23:59";

      const endDateTime =
        new Date(`${shift.date}T${endTime}:00`);

      if (Number.isNaN(endDateTime.getTime())) {
        return false;
      }

      return endDateTime.getTime() < Date.now();
    }

      const date = availabilityDate.value;

        return;

    // ---- Utility ----
    function normalizeStatus(status) {
      const allowed = [
        "tentative",
        "confirmed",
        "completed",
        "cancelled"
      ];

      return allowed.includes(status)
        ? status
        : "tentative";
    }

    function getStatusLabel(status) {
      const labels = {
        tentative: "予定（未定）",
        confirmed: "予定（確定）",
        completed: "実施済み",
        cancelled: "キャンセル"
      };

      return labels[status] || "予定（未定）";
    }

    function getStatusClass(status) {
      return `status-${status}`;
    }

    function compareShiftDateTime(a, b) {
      const aValue =
        `${a.date || ""} ${a.startTime || ""}`;

      const bValue =
        `${b.date || ""} ${b.startTime || ""}`;

      return aValue.localeCompare(bValue);
    }

    function calculateDurationMinutes(startTime, endTime) {
      if (!startTime || !endTime) return 0;

      const [startHour, startMinute] =
        startTime.split(":").map(Number);

      const [endHour, endMinute] =
        endTime.split(":").map(Number);

      return Math.max(
        0,
        (endHour * 60 + endMinute) -
        (startHour * 60 + startMinute)
      );
    }

    function formatHours(minutes) {
      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;

      if (remainingMinutes === 0) {
        return `${hours}時間`;
      }

      return `${hours}時間${remainingMinutes}分`;
    }

    function formatDate(dateString) {
      if (!dateString) return "日付未設定";

      const date =
        new Date(`${dateString}T00:00:00`);

      if (Number.isNaN(date.getTime())) {
        return dateString;
      }

      const weekdays =
        ["日", "月", "火", "水", "木", "金", "土"];

      return (
        `${date.getMonth() + 1}月` +
        `${date.getDate()}日` +
        `（${weekdays[date.getDay()]}）`
      );
    }

    function toDateString(year, monthIndex, day) {
      return (
        `${year}-` +
        `${String(monthIndex + 1).padStart(2, "0")}-` +
        `${String(day).padStart(2, "0")}`
      );
    }

    function getLocalDateString(date) {
      return (
        `${date.getFullYear()}-` +
        `${String(date.getMonth() + 1).padStart(2, "0")}-` +
        `${String(date.getDate()).padStart(2, "0")}`
      );
    }

    function clearMessageLater() {
      setTimeout(() => {
        message.textContent = "";
      }, 2600);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/sw.js")
          .catch((error) => {
            console.error("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
